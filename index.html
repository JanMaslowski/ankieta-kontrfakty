<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ocena kontrfaktów RTG</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root {
    --bg: #f3f5f7; --card: #ffffff; --ink: #18202a; --muted: #5a6573; --line: #d9dee4;
    --accent: #1f5fae; --accent-ink: #ffffff; --ok: #1d7a46; --warn: #a24f0c; --film: #000000; --film-ink: #ffffff;
    --sans: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg: #0f1318; --card: #171c23; --ink: #e5e9ee; --muted: #98a2ae; --line: #2a313a;
    --accent: #6ea4ee; --accent-ink: #0b1220; --ok: #4fc283; --warn: #f0a35a; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
  header { position: sticky; top: 0; z-index: 5; background: var(--card);
           border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; white-space: nowrap; }
  .progress { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; min-width: 60px; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  #counter, #saveState { color: var(--muted); font: 13px var(--mono); white-space: nowrap; }
  #saveState.err { color: var(--warn); }
  .banner { background: var(--warn); color: var(--accent-ink); padding: 8px 16px; font-size: 14px; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 80px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  h2 { font-size: 19px; margin: 0 0 12px; text-wrap: balance; }
  h3 { font-size: 15px; margin: 0 0 10px; }
  p { max-width: 70ch; }
  .muted { color: var(--muted); }
  .eyebrow { font: 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  label.field { display: block; margin: 14px 0 4px; font-weight: 500; }
  input[type=text], select, textarea { width: 100%; max-width: 420px; padding: 8px 10px; font: inherit;
         border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
  textarea { max-width: none; min-height: 60px; }
  button { font: inherit; padding: 9px 18px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--card); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .spacer { flex: 1; }

  .xray { width: 100%; max-width: 100%; aspect-ratio: 1; background: var(--film); border-radius: 4px; display: block;
          object-fit: contain; cursor: zoom-in; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .diag { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 24px; align-items: start; }
  .options { display: grid; gap: 8px; }
  .opt { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line);
         border-radius: 6px; cursor: pointer; }
  .opt:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .opt small { color: var(--muted); display: block; }

  .ref { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; align-items: center; margin-bottom: 16px; }
  .cfs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .cf { border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
  .cf h3 { display: flex; justify-content: space-between; align-items: baseline; }
  .imgwrap { position: relative; }
  .imgwrap .tag { position: absolute; top: 6px; left: 6px; background: var(--film); color: var(--film-ink);
                  font: 11px var(--mono); letter-spacing: .06em; padding: 2px 6px; border-radius: 3px; pointer-events: none; }
  .scale { margin-top: 12px; }
  .scale input[type=range] { width: 100%; accent-color: var(--accent); }
  .scale input.untouched { opacity: .35; }
  .scale .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); gap: 8px; }
  .val { font: 600 18px var(--mono); }
  .val.empty { color: var(--warn); font: 500 12px var(--sans); }
  .hint { font-size: 14px; color: var(--muted); margin: 0 0 14px; }

  .lightbox { position: fixed; inset: 0; background: var(--film); display: flex; align-items: center;
              justify-content: center; z-index: 20; cursor: zoom-out; padding: 16px; }
  .lightbox img { max-width: 100%; max-height: 100%; }

  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 14px; }
  th, td { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; white-space: nowrap; }
  th { font: 12px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }

  @media (max-width: 820px) {
    .diag, .cfs { grid-template-columns: minmax(0, 1fr); }
    header h1 { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Ocena kontrfaktów RTG</h1>
  <div class="progress"><div id="bar"></div></div>
  <span id="counter"></span>
  <span id="saveState"></span>
</header>
<div class="banner" id="noEndpoint" hidden>Tryb testowy: brak adresu arkusza (ENDPOINT), odpowiedzi zapisują się tylko w tej przeglądarce.</div>
<main id="app"></main>
<div class="lightbox" id="lightbox" hidden><img alt="Powiększony obraz"></div>

<script>
// ===================== KONFIGURACJA =====================
// Adres wdrożonej aplikacji Google Apps Script (kończy się na /exec). Patrz README.md.
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzZb7f3xQK1iH1S8-9IYEY6c--h5xjhU9SwNQXPiy5QH-A1AK1GZK8ih4vg50IADbZA/exec";
// =======================================================

// Przypadki są zanonimizowane (P01–P40); mapowanie na przypadki badania zna tylko badacz.
const N = 40;
const PRZYPADKI = Array.from({ length: N }, (_, i) => "P" + String(i + 1).padStart(2, "0"));
const CHOROBY = [
  { kod: "Cardiomegaly", pl: "Kardiomegalia", opis: "powiększenie sylwetki serca" },
  { kod: "Effusion",     pl: "Płyn w jamie opłucnej", opis: "wysięk opłucnowy" },
  { kod: "Edema",        pl: "Obrzęk płuc", opis: "" },
  { kod: "Pneumothorax", pl: "Odma opłucnowa", opis: "" },
];
const LITERY = ["A", "B", "C"];
const STORAGE_KEY = "ankieta_kontrfakty_v2";
const img = (id, w) => `img/${id}/${w.toLowerCase()}.png`;
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let S = load() || { sesja: null, oceniajacy: null, kolejnosc: null, idx: 0, odpowiedzi: {}, doWyslania: [] };
S.doWyslania ||= [];
function load() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { return null; } }
function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); } catch {} }

// ---------- wysyłka do arkusza (kolejka ponawiana przy błędzie) ----------
let sending = false;
async function flush() {
  if (!ENDPOINT || sending || !S.doWyslania.length) return updateSaveState();
  sending = true; setSave("Wysyłanie…");
  try {
    while (S.doWyslania.length) {
      const res = await fetch(ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                                          body: JSON.stringify(S.doWyslania[0]) });
      const j = await res.json();
      if (!j.ok) throw new Error(j.error);
      S.doWyslania.shift(); save();
    }
  } catch { /* zostaje w kolejce; ponowimy przy następnym zapisie lub odświeżeniu */ }
  sending = false; updateSaveState();
}
function updateSaveState() {
  if (!ENDPOINT) return setSave("");
  const n = S.doWyslania.length;
  n ? setSave(`${n} niewysłane, ponowię`, true) : setSave(S.oceniajacy ? "Wysłano" : "");
}
function setSave(t, err) { const el = document.getElementById("saveState"); el.textContent = t; el.classList.toggle("err", !!err); }
window.addEventListener("online", flush);

function rowFor(id) {
  const o = S.odpowiedzi[id];
  return { sesja: S.sesja, oceniajacy: S.oceniajacy.id, specjalizacja: S.oceniajacy.specjalizacja,
    doswiadczenie_lata: S.oceniajacy.doswiadczenie_lata, kolejnosc: S.kolejnosc.indexOf(id) + 1, przypadek: id,
    diagnoza_oryginalu: o.diagnoza, pewnosc: o.pewnosc ?? "", zmiana_A: o.A, zmiana_B: o.B, zmiana_C: o.C,
    czas_s: o.czas_s ?? "", zapisano: o.zapisano ?? "", uwagi: o.uwagi || "" };
}

// ---------- deterministyczne tasowanie (seed = identyfikator sesji) ----------
function rng(str) { let h = 2166136261; for (const c of str) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; }; }
function shuffle(a, seed) { const r = rng(seed); a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function updateHeader() {
  const done = Object.values(S.odpowiedzi).filter(o => o.ukonczono).length;
  document.getElementById("bar").style.width = (100 * done / N) + "%";
  document.getElementById("counter").textContent = S.oceniajacy ? `${done}/${N}` : "";
}

// ---------- ekrany ----------
function renderStart() {
  $app.innerHTML = `
    <div class="card">
      <div class="eyebrow">NIH ChestX-ray14 · ${N} przypadków</div>
      <h2>Ocena zmodyfikowanych zdjęć RTG klatki piersiowej</h2>
      <p>W każdym przypadku zobaczy Pan/Pani <b>oryginalne zdjęcie RTG</b> i wybierze rozpoznanie spośród czterech chorób.
         Następnie pokażemy <b>trzy zmodyfikowane wersje</b> tego zdjęcia (A, B, C), wygenerowane przez algorytmy AI.
         Każdą wersję prosimy ocenić w skali <b>0–10</b>: <b>na ile ta zmiana obrazu zmieniłaby Pana/Pani rozpoznanie</b>.</p>
      <ul class="muted">
        <li>Jeden przypadek zajmuje zwykle 1–2 minuty.</li>
        <li>Obrazy mają 256×256 px (przeskalowane z oryginałów 1024×1024). Kliknięcie powiększa obraz.</li>
        <li>Przytrzymanie obrazu wersji A/B/C pokazuje w tym miejscu oryginał, co ułatwia porównanie.</li>
        <li>Odpowiedzi są wysyłane do zespołu badawczego po każdym przypadku. Można przerwać i wrócić później
            w tej samej przeglądarce.</li>
      </ul>
      <form id="startForm">
        <label class="field" for="rid">Identyfikator lub inicjały *</label>
        <input type="text" id="rid" placeholder="np. LEK01" autocomplete="off">
        <label class="field" for="spec">Specjalizacja</label>
        <select id="spec">
          <option value="">Wybierz</option>
          <option>Radiologia (specjalista)</option><option>Radiologia (rezydent)</option>
          <option>Choroby wewnętrzne</option><option>Pulmonologia</option><option>Kardiologia</option>
          <option>Medycyna ratunkowa</option><option>Inna</option>
        </select>
        <label class="field" for="exp">Doświadczenie w ocenie RTG klatki piersiowej (lata)</label>
        <input type="text" id="exp" inputmode="numeric" placeholder="np. 5" autocomplete="off">
        <div class="row" style="margin-top:20px"><button class="primary" id="go" type="submit" disabled>Rozpocznij ankietę</button></div>
      </form>
    </div>`;
  const rid = document.getElementById("rid"), go = document.getElementById("go");
  rid.oninput = () => go.disabled = !rid.value.trim();
  document.getElementById("startForm").onsubmit = e => {
    e.preventDefault();
    S.sesja = (crypto.randomUUID?.() || String(Math.random()).slice(2)).slice(0, 12);
    S.oceniajacy = { id: rid.value.trim(), specjalizacja: document.getElementById("spec").value,
                     doswiadczenie_lata: document.getElementById("exp").value.trim() };
    S.kolejnosc = shuffle(PRZYPADKI, S.sesja);
    S.idx = 0; save(); render();
  };
}

function renderCase() {
  const id = S.kolejnosc[S.idx];
  const o = S.odpowiedzi[id] ||= { diagnoza: null, pewnosc: null, A: null, B: null, C: null, uwagi: "", krok: 1, t_start: Date.now() };
  const nr = S.idx + 1;

  if (o.krok !== 2) {
    $app.innerHTML = `
      <div class="card">
        <div class="row"><h2>Przypadek ${nr} z ${N}</h2><span class="spacer"></span><span class="eyebrow">Krok 1 z 2 · rozpoznanie</span></div>
        <div class="diag">
          <img class="xray zoomable" src="${img(id, "o")}" alt="Oryginalne zdjęcie RTG">
          <div>
            <h3>Jakie jest najbardziej prawdopodobne rozpoznanie na tym zdjęciu?</h3>
            <div class="options">
              ${CHOROBY.map((c, i) => `
                <label class="opt"><input type="radio" name="dx" id="dx${i}" value="${c.kod}" ${o.diagnoza === c.kod ? "checked" : ""}>
                  <span>${c.pl}${c.opis ? `<small>${c.opis}</small>` : ""}</span></label>`).join("")}
            </div>
            <label class="field" for="conf">Pewność rozpoznania</label>
            <select id="conf">
              <option value="">Wybierz</option>
              ${["niska", "średnia", "wysoka"].map(v => `<option ${o.pewnosc === v ? "selected" : ""}>${v}</option>`).join("")}
            </select>
          </div>
        </div>
      </div>
      <div class="row">
        <button id="prev" ${S.idx === 0 ? "disabled" : ""}>← Poprzedni</button>
        <span class="spacer"></span>
        <button class="primary" id="next" disabled>Dalej: wersje zmodyfikowane →</button>
      </div>`;
    const next = document.getElementById("next");
    const check = () => next.disabled = !document.querySelector("input[name=dx]:checked");
    document.querySelectorAll("input[name=dx]").forEach(r => r.onchange = check); check();
    next.onclick = () => {
      o.diagnoza = document.querySelector("input[name=dx]:checked").value;
      o.pewnosc = document.getElementById("conf").value || null;
      o.krok = 2; save(); render(); scrollTo(0, 0);
    };
    document.getElementById("prev").onclick = () => { S.idx--; save(); render(); };
  } else {
    const dx = CHOROBY.find(c => c.kod === o.diagnoza);
    $app.innerHTML = `
      <div class="card">
        <div class="row"><h2>Przypadek ${nr} z ${N}</h2><span class="spacer"></span><span class="eyebrow">Krok 2 z 2 · wersje zmodyfikowane</span></div>
        <div class="ref">
          <img class="xray zoomable" src="${img(id, "o")}" alt="Oryginał">
          <div><div class="muted">Oryginał. Pana/Pani rozpoznanie:</div><b>${dx.pl}</b>
            <button class="link" id="changeDx">zmień</button></div>
        </div>
        <p class="hint">Dla każdej wersji: <b>na ile zmiana obrazu zmienia Pana/Pani rozpoznanie</b> w porównaniu z oryginałem?
          0 = rozpoznanie bez zmian, 10 = rozpoznanie całkowicie zmienione. Przytrzymaj obraz, aby zobaczyć oryginał.</p>
        <div class="cfs">
          ${LITERY.map(L => `
            <div class="cf">
              <h3><span>Wersja ${L}</span><span class="val ${o[L] == null ? "empty" : ""}" id="v${L}">${o[L] ?? "nie oceniono"}</span></h3>
              <div class="imgwrap">
                <img class="xray zoomable" src="${img(id, L)}" data-cf="${img(id, L)}" data-orig="${img(id, "o")}" alt="Wersja ${L}" draggable="false">
                <span class="tag" hidden>ORYGINAŁ</span>
              </div>
              <div class="scale">
                <input type="range" id="r${L}" min="0" max="10" step="1" value="${o[L] ?? 5}" data-l="${L}"
                       class="${o[L] == null ? "untouched" : ""}" aria-label="Zmiana rozpoznania, wersja ${L}">
                <div class="ends"><span>0 · bez zmiany</span><span>5</span><span>10 · całkowita zmiana</span></div>
              </div>
            </div>`).join("")}
        </div>
        <label class="field" for="uwagi">Uwagi do przypadku (opcjonalnie)</label>
        <textarea id="uwagi" placeholder="np. artefakty, nierealistyczna anatomia, inna patologia">${esc(o.uwagi)}</textarea>
      </div>
      <div class="row">
        <button id="back">← Wróć do rozpoznania</button>
        <span class="spacer"></span>
        <button class="primary" id="next" disabled>${S.idx === N - 1 ? "Zapisz i zakończ" : "Zapisz i dalej →"}</button>
      </div>`;
    const next = document.getElementById("next");
    const check = () => next.disabled = LITERY.some(L => o[L] == null);
    document.querySelectorAll("input[type=range]").forEach(r => {
      const set = () => { const L = r.dataset.l; o[L] = +r.value; r.classList.remove("untouched");
        const v = document.getElementById("v" + L); v.textContent = r.value; v.classList.remove("empty"); save(); check(); };
      r.oninput = set; r.onclick = set;
    });
    check();
    document.getElementById("uwagi").oninput = e => { o.uwagi = e.target.value; save(); };
    const toStep1 = () => { o.krok = 1; save(); render(); };
    document.getElementById("changeDx").onclick = toStep1;
    document.getElementById("back").onclick = toStep1;
    next.onclick = () => {
      o.ukonczono = true; o.czas_s = Math.round((Date.now() - o.t_start) / 1000); o.zapisano = new Date().toISOString();
      S.doWyslania.push(rowFor(id));   // poprawka wcześniejszego przypadku wysyła nowy wiersz; w analizie bierzemy najnowszy
      S.idx = Math.min(S.idx + 1, N); save(); flush(); render(); scrollTo(0, 0);
    };
    bindCompare();
  }
  bindZoom();
}

function renderEnd() {
  const ids = S.kolejnosc.filter(id => S.odpowiedzi[id]?.ukonczono);
  const pending = ENDPOINT ? S.doWyslania.length : ids.length;
  $app.innerHTML = `
    <div class="card">
      <h2>Dziękujemy!</h2>
      <p>Oceniono <b>${ids.length}</b> z ${N} przypadków.
        ${pending ? `<b>${pending} odpowiedzi nie udało się jeszcze wysłać.</b> Prosimy pobrać plik CSV i przesłać go badaczowi.`
                  : "Wszystkie odpowiedzi zostały wysłane do zespołu badawczego. Nie trzeba niczego przesyłać."}</p>
      <div class="row">
        <button class="${pending ? "primary" : ""}" id="csv">Pobierz kopię odpowiedzi (CSV)</button>
        ${ENDPOINT && pending ? `<button id="retry">Spróbuj wysłać ponownie</button>` : ""}
        <span class="spacer"></span>
        <button id="review">← Przejrzyj lub popraw odpowiedzi</button>
      </div>
    </div>
    <div class="card tablewrap">
      <table><thead><tr><th>#</th><th>Rozpoznanie</th><th>Pewność</th><th>A</th><th>B</th><th>C</th></tr></thead>
      <tbody>${ids.map(id => { const o = S.odpowiedzi[id];
        return `<tr><td>${S.kolejnosc.indexOf(id) + 1}</td><td>${CHOROBY.find(c => c.kod === o.diagnoza).pl}</td>
        <td>${o.pewnosc ?? ""}</td><td>${o.A}</td><td>${o.B}</td><td>${o.C}</td></tr>`; }).join("")}</tbody></table>
    </div>`;
  document.getElementById("csv").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([toCSV(ids.map(rowFor))], { type: "text/csv;charset=utf-8" }));
    a.download = `oceny_${S.oceniajacy.id.replace(/[^\w-]+/g, "_")}.csv`; a.click();
  };
  document.getElementById("retry")?.addEventListener("click", async () => { await flush(); render(); });
  document.getElementById("review").onclick = () => { S.idx = N - 1; save(); render(); };
}
function toCSV(rs) {
  if (!rs.length) return "";
  const cols = Object.keys(rs[0]);
  const q = v => { v = String(v ?? ""); return /[",\n;]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  return [cols.join(","), ...rs.map(r => cols.map(c => q(r[c])).join(","))].join("\n");
}

// ---------- obrazy: przytrzymanie = oryginał, kliknięcie = powiększenie ----------
function bindCompare() {
  document.querySelectorAll(".imgwrap").forEach(w => {
    const im = w.querySelector("img"), tag = w.querySelector(".tag"); let held = false, timer;
    const show = () => { held = true; im.src = im.dataset.orig; tag.hidden = false; };
    const hide = () => { clearTimeout(timer); if (held) { im.src = im.dataset.cf; tag.hidden = true; } };
    w.addEventListener("pointerdown", e => { e.preventDefault(); timer = setTimeout(show, 180); });
    ["pointerup", "pointerleave", "pointercancel"].forEach(ev => w.addEventListener(ev, hide));
    w.addEventListener("click", e => { if (held) { e.stopPropagation(); held = false; } }, true);
    w.addEventListener("contextmenu", e => e.preventDefault());
  });
}
const lb = document.getElementById("lightbox");
function bindZoom() {
  document.querySelectorAll(".zoomable").forEach(im => im.addEventListener("click", () => {
    lb.querySelector("img").src = im.dataset.cf || im.src; lb.hidden = false; }));
}
lb.onclick = () => lb.hidden = true;
document.addEventListener("keydown", e => { if (e.key === "Escape") lb.hidden = true; });

function render() {
  updateHeader();
  if (!S.oceniajacy) return renderStart();
  if (S.idx >= N) return renderEnd();
  renderCase();
}

flush();
