<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocena kontrfaktów RTG v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  [hidden] { display: none !important; }   /* .lightbox ma display:flex, które inaczej nadpisuje hidden */
  /* Układ: pasek postępu u góry, jedna pozycja na ekran; w przypadku zakładki Oryginał · A–G · Podsumowanie.
     Obrazy zawsze na czarnym tle, jak w przeglądarce PACS. */
  :root {
    --bg: #f2f4f6; --card: #ffffff; --ink: #18202a; --muted: #5a6573; --line: #d7dde3;
    --accent: #1f5fae; --accent-ink: #ffffff; --accent-soft: #e3ecf8; --ok: #1d7a46; --warn: #a24f0c;
    --film: #000000; --film-ink: #ffffff;
    --sans: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0f1318; --card: #171c23; --ink: #e5e9ee; --muted: #98a2ae; --line: #2a313a;
    --accent: #6ea4ee; --accent-ink: #0b1220; --accent-soft: #1b2a40; --ok: #4fc283; --warn: #f0a35a; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #0f1318; --card: #171c23; --ink: #e5e9ee; --muted: #98a2ae; --line: #2a313a;
    --accent: #6ea4ee; --accent-ink: #0b1220; --accent-soft: #1b2a40; --ok: #4fc283; --warn: #f0a35a; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--card);
           border-bottom: 1px solid var(--line); padding-block: 10px;
           padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
           display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; white-space: nowrap; }
  .progress { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; min-width: 60px; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  #counter, #saveState { color: var(--muted); font: 13px var(--mono); white-space: nowrap; }
  #saveState.err { color: var(--warn); }
  main { max-width: 1180px; margin: 0 auto; padding-block: 20px 80px;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  h2 { font-size: 19px; margin: 0 0 8px; text-wrap: balance; }
  h3 { font-size: 15px; margin: 0 0 8px; }
  p, li { max-width: 72ch; }
  .muted { color: var(--muted); }
  .eyebrow { font: 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  label.field { display: block; margin: 14px 0 4px; font-weight: 500; }
  input[type=text], input[type=number], select, textarea { width: 100%; max-width: 420px; padding: 8px 10px; font: inherit;
         border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
  textarea { max-width: none; min-height: 60px; }
  button { font: inherit; padding: 9px 18px; border-radius: 6px; border: 1px solid var(--line);
           background: var(--card); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .spacer { flex: 1; }
  .task { background: var(--accent-soft); border-radius: 6px; padding: 10px 14px; margin: 8px 0 0; max-width: none; }

  /* zakładki przypadku */
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 0; }
  .tab { padding: 6px 12px; font: 500 13px var(--mono); border-radius: 999px; }
  .tab.cur { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .tab.done:not(.cur) { color: var(--ok); border-color: var(--ok); }

  /* klisze: arkusz 8 kafli (oryginał, A–G), pokazujemy jeden kafel przez background-position */
  .film { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1; background-color: var(--film);
          background-repeat: no-repeat; border-radius: 4px; cursor: zoom-in; user-select: none; -webkit-user-select: none;
          touch-action: manipulation; }
  .film .tag { position: absolute; top: 6px; left: 6px; background: var(--film); color: var(--film-ink);
               font: 11px var(--mono); letter-spacing: .06em; padding: 2px 6px; border-radius: 3px; pointer-events: none;
               border: 1px solid #ffffff55; }
  .film .tag.alt { background: var(--accent); color: var(--accent-ink); }
  .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
  .pair figure { margin: 0; min-width: 0; }
  .pair figcaption { font: 12px var(--mono); color: var(--muted); margin-bottom: 4px; letter-spacing: .04em; text-transform: uppercase; }
  .vlayout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; align-items: start; margin-top: 16px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .tools button { padding: 6px 12px; font-size: 14px; }
  kbd { font: 12px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .single { max-width: 560px; }

  /* pytania */
  .q { padding: 12px 0; border-top: 1px solid var(--line); }
  .q:first-child { border-top: 0; padding-top: 0; }
  .q > .qt { font-weight: 600; margin-bottom: 6px; }
  .q > .qt small { font-weight: 400; color: var(--muted); }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg label { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line);
               border-radius: 6px; cursor: pointer; font-size: 14px; }
  .seg label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .seg input { accent-color: var(--accent); }
  .seg.num label { min-width: 44px; justify-content: center; font: 600 15px var(--mono); }
  .seg.num input { position: absolute; opacity: 0; pointer-events: none; }
  .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); max-width: 300px; margin-top: 4px; }
  .sub { margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 6px 6px 0; }
  .sub .qt { font-weight: 500; margin: 8px 0 4px; }
  .sub .qt:first-child { margin-top: 0; }
  .ctr { display: flex; gap: 12px; flex-wrap: wrap; }
  .ctr label { font-size: 13px; color: var(--muted); }
  .ctr input { width: 110px; display: block; }
  .missing { color: var(--warn); font-size: 13px; }

  .lightbox { position: fixed; inset: 0; background: var(--film); display: flex; flex-direction: column; align-items: center;
              justify-content: center; gap: 10px; z-index: 20; padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); }
  .lightbox .film { width: min(94vw, calc(100vh - 110px)); max-width: 1024px; cursor: zoom-out; }
  .lightbox .bar { display: flex; gap: 10px; align-items: center; color: var(--film-ink); font: 13px var(--mono); flex-wrap: wrap; justify-content: center; }
  .lightbox button { background: var(--film); color: var(--film-ink); border-color: #ffffff66; }

  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 14px; }
  th, td { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; white-space: nowrap; }
  th { font: 12px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
  .pill.done { color: var(--ok); border-color: var(--ok); }
  textarea.csv { font: 12px var(--mono); min-height: 160px; margin-top: 12px; }

  @media (max-width: 860px) {
    .vlayout { grid-template-columns: minmax(0, 1fr); }
    header h1 { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .progress > div { transition: none; } }
</style>
</head>
<body>

<header>
  <h1>Ocena kontrfaktów RTG · v2</h1>
  <div class="progress"><div id="bar"></div></div>
  <span id="counter"></span>
  <span id="saveState"></span>
  <button class="link" id="ownerBtn" hidden>Panel badacza</button>
</header>
<main id="app"><div class="card"><p class="muted">Łączenie z bazą odpowiedzi…</p></div></main>
<div class="lightbox" id="lightbox" hidden>
  <div class="film" id="lbFilm"><span class="tag" id="lbTag"></span></div>
  <div class="bar"><button id="lbFlip" type="button">Przełącz oryginał ↔ wersja</button><span><kbd>spacja</kbd> przełącza · <kbd>Esc</kbd> zamyka</span><button id="lbClose" type="button">Zamknij</button></div>
</div>

<script src="config.js"></script>
<script>
// Wersja 2 badania (3 XI 2026). Przypadki zanonimizowane (P01–P60), pozycje realizmu R01–R33;
// mapowanie na metody zna tylko badacz (results/ankieta_nih/KLUCZ_nie_dla_oceniajacego.csv).
// Wersja na GitHub Pages: bez logowania; odpowiedzi idą do Arkusza Google przez Google Apps Script
// (config.js: API_URL; kod skryptu: tools/ankieta_nih/apps_script/Code.gs).
// Wersja strony; ta sama wartość jest w dane.json ("strona"). Przy każdym wdrożeniu zmień obie:
// otwarte karty co 3 min sprawdzają dane.json i po zmianie same się przeładowują (po wysłaniu odpowiedzi).
const WERSJA_STRONY = "2026-11-04b";
const CHOROBY = {
  Cardiomegaly: { pl: "kardiomegalia", dop: "kardiomegalii", narz: "kardiomegalią", opis: "powiększenie sylwetki serca" },
  Effusion:     { pl: "płyn w jamie opłucnej", dop: "płynu w jamie opłucnej", narz: "płynem w jamie opłucnej", opis: "" },
  Edema:        { pl: "obrzęk płuc", dop: "obrzęku płuc", narz: "obrzękiem płuc", opis: "" },
};
const LITERY = ["A", "B", "C", "D", "E", "F", "G"];
const KROKI = ["O", ...LITERY, "K"];          // oryginał, wersje, podsumowanie
const ZMIANY = [
  ["brak", "brak"], ["urzadzenia", "urządzenia (dreny, elektrody, cewniki, rozrusznik)"],
  ["opisy", "opisy i znaczniki (litery L/R, tekst)"], ["kosci", "kości"], ["tkanki", "tkanki miękkie"],
  ["inna", "inna choroba"], ["kontrast", "ogólny kontrast lub jasność"], ["artefakty", "artefakty (szum, plamy, smugi, kolorowe piksele, siatka, rozmycie)"],
];
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let SEQ = [], SEQ_ALL = [], NPRZ = 0;   // SEQ_ALL: pełna lista z dane.json, SEQ: bez pozycji wycofanych (pomin)
const PANEL = new URLSearchParams(location.search).has("panel");   // ?panel = panel badacza (hasło)
let token = null, isOwner = PANEL;   // token = kod powrotu oceniającego (zamiast konta)
let ODP = {};           // wszystkie odpowiedzi tego kodu: klucz <sesja>__<pozycja> → dokument
let K = null;           // dokument konta: {sesje: {S1: {...}}, aktywna}
let O = {};              // odpowiedzi aktywnej sesji: id pozycji → dokument
let view = "survey";
const ses = () => K?.aktywna ? K.sesje[K.aktywna] : null;

// ---------- zapis: Arkusz Google (Apps Script). Kolejka w localStorage, wysyłana paczkami ----------
// Każdy wpis to {rodzaj: "konto"|"odp", klucz, dane}; nowszy wpis o tym samym kluczu zastępuje starszy.
// Gdy sieć nie działa, kolejka czeka w przeglądarce i wysyła się przy następnej próbie (co 15 s).
const LSK = k => `ankieta_nih_v2_${k}`;
const lsGet = k => { try { return JSON.parse(localStorage.getItem(LSK(k))); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(LSK(k), JSON.stringify(v)); } catch {} };
function setSave(t, err) { const el = document.getElementById("saveState"); el.textContent = t; el.classList.toggle("err", !!err); }
async function api(params, body) {
  const r = body
    ? await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })
    : await fetch(API_URL + "?" + new URLSearchParams(params));
  const j = await r.json();
  if (!j.ok) throw new Error(j.blad || "błąd serwera");
  return j;
}
let kolejka = {}, wysylanie = false, flushTimer = null, retryTimer = null;
function enqueue(rodzaj, klucz, dane) {
  kolejka[`${rodzaj}:${klucz}`] = { rodzaj, klucz, dane: JSON.parse(JSON.stringify(dane)) };
  lsSet("kolejka_" + token, kolejka);
  lsSet("kopia_" + token, { konto: K, odp: ODP });
  clearTimeout(flushTimer); flushTimer = setTimeout(flush, 400);
}
// Nowa wersja na serwerze → przeładuj kartę (najpierw wysyłka zaległych odpowiedzi; bez pętli przeładowań).
async function sprawdzWersje() {
  try {
    const d = await (await fetch("dane.json?t=" + Date.now(), { cache: "no-store" })).json();
    if (!d.strona || d.strona === WERSJA_STRONY) return false;
    if (Object.keys(kolejka).length) { await flush(); if (Object.keys(kolejka).length) return false; }
    try { if (sessionStorage.getItem("przeladowano") === d.strona) return false; sessionStorage.setItem("przeladowano", d.strona); } catch {}
    const q = new URLSearchParams(location.search); q.set("v", d.strona);
    location.replace(location.pathname + "?" + q.toString());
    return true;
  } catch { return false; }
}
async function flush() {
  if (wysylanie || !token) return;
  const wpisy = Object.entries(kolejka);
  if (!wpisy.length) return;
  wysylanie = true; setSave("Zapisywanie…");
  try {
    await api(null, { akcja: "zapisz", token, wpisy: wpisy.map(([, w]) => w) });
    for (const [k, w] of wpisy) if (kolejka[k] === w) delete kolejka[k];   // nie kasuj, jeśli w trakcie przyszła nowsza wersja
    lsSet("kolejka_" + token, kolejka);
    setSave(Object.keys(kolejka).length ? "Zapisywanie…" : "Zapisano");
  } catch (e) {
    setSave("Brak połączenia — odpowiedzi czekają w przeglądarce, ponowię zapis", true);
    clearTimeout(retryTimer); retryTimer = setTimeout(flush, 15000);
  } finally {
    wysylanie = false;
    if (Object.keys(kolejka).length && !retryTimer) setTimeout(flush, 300);
    retryTimer = null;
  }
}
addEventListener("online", flush);
addEventListener("beforeunload", e => { if (Object.keys(kolejka).length) { flush(); e.preventDefault(); e.returnValue = ""; } });
let timers = {};
function saveKonto() { const s = ses(); if (s) s.aktualizacja = new Date().toISOString(); enqueue("konto", "konto", K); }
function saveItem(id, now) {
  clearTimeout(timers[id]);
  const go = () => { const o = O[id]; o.aktualizacja = new Date().toISOString();
    ODP[`${K.aktywna}__${id}`] = o; enqueue("odp", `${K.aktywna}__${id}`, o); };
  if (now) go(); else { setSave("Zmiany…"); timers[id] = setTimeout(go, 700); }
}
function nowyToken() {
  const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", b = crypto.getRandomValues(new Uint8Array(10));
  return Array.from(b, x => a[x % a.length]).join("");
}
async function wczytajKod(t) {      // dane oceniającego z arkusza; przy braku sieci kopia z przeglądarki
  let konto = null, odp = [];
  try { const j = await api({ akcja: "wczytaj", token: t }); konto = j.konto; odp = j.odp || []; }
  catch (e) { const c = lsGet("kopia_" + t); if (!c) throw e; konto = c.konto; odp = Object.values(c.odp || {}); }
  token = t; lsSet("token", t);
  kolejka = lsGet("kolejka_" + t) || {};
  K = konto ? JSON.parse(JSON.stringify(konto)) : { sesje: {}, aktywna: null }; K.sesje ||= {};
  ODP = {}; for (const o of odp) ODP[`${o.sesja}__${o.pozycja}`] = o;
  for (const w of Object.values(kolejka)) {        // niewysłane zmiany są nowsze niż arkusz
    if (w.rodzaj === "konto") K = JSON.parse(JSON.stringify(w.dane)); else ODP[w.klucz] = w.dane;
  }
  if (Object.keys(kolejka).length) flush();
}

function updateHeader() {
  const s = ses(), n = SEQ.length;
  const done = s ? SEQ.filter(it => O[it.id]?.ukonczono).length : 0;
  document.getElementById("bar").style.width = (n ? 100 * done / n : 0) + "%";
  const it = s && SEQ[s.idx];
  document.getElementById("counter").textContent = s?.oceniajacy && it
    ? (it.typ === "przypadek" ? `przypadek ${it.nr} z ${NPRZ}` : `pozycja ${s.idx + 1} z ${n}`) + ` · ${K.aktywna} · kod ${token}` : "";
  const ob = document.getElementById("ownerBtn");
  ob.hidden = !isOwner; ob.textContent = view === "owner" ? "Wróć do ankiety" : "Panel badacza";
}

// ---------- obrazy ----------
const sprite = id => `img/${id}.png`;
function filmStyle(id, kafel) {      // kafel: 0 = oryginał, 1–7 = A–G; null = pojedynczy obraz (realizm)
  if (kafel == null) return `background-image:url(${sprite(id)});background-size:contain;background-position:center`;
  return `background-image:url(${sprite(id)});background-size:${(LITERY.length + 1) * 100}% 100%;background-position:${kafel * 100 / LITERY.length}% 0`;
}
const preloaded = new Set();
function preload(i) { const it = SEQ[i]; if (it && !preloaded.has(it.id)) { preloaded.add(it.id); new Image().src = sprite(it.id); } }

// ---------- ekrany ----------
function renderNoAccess(msg) { $app.innerHTML = `<div class="card"><h2>Nie można zapisywać odpowiedzi</h2><p>${msg}</p></div>`; }

function renderStart() {
  const istn = Object.entries(K.sesje || {});
  $app.innerHTML = `
    <div class="card">
      <div class="eyebrow">NIH ChestX-ray14 · ${NPRZ} przypadków · 3 choroby</div>
      <h2>Ocena zmodyfikowanych zdjęć RTG klatki piersiowej</h2>
      <p>Model AI rozpoznaje na zdjęciach RTG kardiomegalię, płyn w jamie opłucnej i obrzęk płuc. Kilka algorytmów
         próbowało zmienić każde zdjęcie tak, żeby <b>dodać</b> albo <b>usunąć</b> objawy jednej z tych chorób.
         W każdym przypadku zobaczy Pan/Pani oryginał i <b>sześć zmodyfikowanych wersji</b> (oznaczonych literami), w losowej kolejności.</p>
      <ul>
        <li><b>Oryginał:</b> czy widać na nim daną chorobę.</li>
        <li><b>Każda wersja:</b> czy objawy zostały dodane (usunięte), czy zmiana jest we właściwym miejscu,
            co jeszcze się zmieniło (w tym artefakty: szum, plamy, kolorowe piksele) i czy obraz wygląda jak zdjęcie RTG tego samego pacjenta, z chorobą albo bez niej.</li>
        <li><b>Na koniec:</b> która wersja wypadła najlepiej.</li>
        <li>Co kilka przypadków pojawi się pojedynczy obraz do oceny realizmu, bez oryginału.</li>
      </ul>
      <p class="muted"><b>Rozdzielczość:</b> obrazy mają 256 × 256 px (oryginały NIH 1024 px), pokazujemy je powiększone ×2.
         To rozdzielczość badawcza, nie diagnostyczna. Drobne objawy, np. linie Kerleya, mogą być niewidoczne.
         Przycisk „Przełącz” albo <kbd>spacja</kbd> podmienia wersję na oryginał w tym samym miejscu, co ułatwia
         wychwycenie subtelnych zmian. Kliknięcie obrazu powiększa go.</p>
      <p class="muted">Całość zajmuje ok. 2,5–3 godzin. Odpowiedzi zapisują się online na bieżąco: można przerwać w dowolnej
         chwili i wrócić później. Na tym samym komputerze i w tej samej przeglądarce ankieta otworzy się tam, gdzie
         Pan/Pani skończył(a). Na innym urządzeniu wystarczy wpisać <b>kod powrotu</b> (pokazujemy go po rozpoczęciu
         i w nagłówku strony). Nie trzeba zakładać konta.</p>
    </div>
    ${token ? `<div class="card"><h3>Kod powrotu: <code style="font-size:20px">${token}</code></h3>

                   start: new Date().toISOString(), idx: 0, ukonczone: 0, seq: 2 };
    K.aktywna = k; O = {}; saveKonto(); render();
  };
}

function openSession(k) {
  K.aktywna = k; O = {};
  for (const [kl, o] of Object.entries(ODP)) if (kl.startsWith(k + "__")) O[o.pozycja] = JSON.parse(JSON.stringify(o));
  // 4 XI 2026: sesje zaczęte przed wycofaniem pozycji (seq < 2) mają idx liczony na pełnej liście;
  // przeliczamy go raz na pierwszą niewycofaną pozycję od miejsca, w którym oceniający był.
  const s = K.sesje[k];
  if (s && (s.seq ?? 1) < 2) {
    const i = SEQ.findIndex(it => SEQ_ALL.indexOf(it) >= (s.idx ?? 0));
    s.idx = i < 0 ? SEQ.length : i; s.seq = 2;
    s.ukonczone = SEQ.filter(it => O[it.id]?.ukonczono).length;
  }
  saveKonto(); render();
}

function nowy(it) {
  const s = ses();
  return it.typ === "realizm"
    ? { sesja: K.aktywna, oceniajacy: s.oceniajacy.id, pozycja: it.id, typ: "realizm", realizm: null, t_start: Date.now() }
    : { sesja: K.aktywna, oceniajacy: s.oceniajacy.id, pozycja: it.id, typ: "przypadek", choroba: it.choroba,
        kierunek: it.kierunek, krok: "O", oryginal: null, wersje: {}, najlepsza: null, uwagi: "", t_start: Date.now() };
}

function go(delta) {
  const s = ses(); s.idx = Math.max(0, Math.min(SEQ.length, s.idx + delta));
  s.ukonczone = SEQ.filter(it => O[it.id]?.ukonczono).length;
  saveKonto(); render(); scrollTo(0, 0);
}
function finishItem(o) {
  if (!o.ukonczono) { o.ukonczono = true; o.czas_s = Math.round((Date.now() - o.t_start) / 1000); }
  o.zapisano = new Date().toISOString();
  saveItem(o.pozycja, true); go(1);
}

function seg(name, opts, val, num) {

    `<label><input type="radio" name="${name}" value="${v}" ${String(val) === String(v) ? "checked" : ""}>${t}</label>`).join("")}</div>`;
}

function wersjaKompletna(o, L) {
  const w = o.wersje[L]; if (!w) return false;
  if (w.q1 == null || !w.q2 || !(w.q3 || []).length || w.q4 == null) return false;
  if (w.q1 >= 3) {
    if (o.choroba === "Cardiomegaly" && !w.card_co) return false;
    if (o.choroba === "Effusion" && (!w.eff_strona || !w.eff_menisk)) return false;
    if (o.choroba === "Edema" && !(w.edem_inne || []).length) return false;
  }
  return true;
}

function renderTabsState(o) { $app.querySelectorAll(".tab").forEach(b => { b.disabled = b.dataset.k !== "O" && !o.oryginal;

        `<label><input type="checkbox" name="edem_inne" value="${v}" ${(w.edem_inne || []).includes(v) ? "checked" : ""}>${t}</label>`).join("")}</div>`;
    specBox.innerHTML = `<div class="sub">${h}</div>`;

  $app.querySelectorAll("#qs input[name=q4]").forEach(r => r.onchange = () => { w.q4 = +r.value; touch(); });
  const inna = document.getElementById("q3inna");

    w.q3 = v; inna.hidden = !v.includes("inna"); touch(); });
  inna.oninput = () => { w.q3_inna = inna.value; touch(); };

  const f = document.getElementById("flip"), tag = document.getElementById("flipTag"), j = LITERY.indexOf(L) + 1;
  let pokazOryg = false, held = false, timer;
  const set = v => { pokazOryg = v; f.style.backgroundPosition = `${(v ? 0 : j) * 100 / LITERY.length}% 0`;
    tag.textContent = v ? "ORYGINAŁ" : "WERSJA " + L; tag.classList.toggle("alt", v); };

  f.addEventListener("click", e => { if (held) { e.stopImmediatePropagation(); held = false; } }, true);
  f.addEventListener("contextmenu", e => e.preventDefault());
}

function lbSet() {
  const { id, k, alt } = lbStan, kk = alt ? 0 : k;
  lbFilm.setAttribute("style", filmStyle(id, kk));
  lbTag.textContent = kk == null ? "" : kk === 0 ? "ORYGINAŁ" : "WERSJA " + LITERY[kk - 1];
  lbTag.hidden = kk == null; lbTag.classList.toggle("alt", !!alt);
  document.getElementById("lbFlip").hidden = !(k > 0);
}
function bindZoom() {
  $app.querySelectorAll(".zoomable").forEach(el => el.addEventListener("click", () => {
    const k = el.dataset.k == null ? null : +el.dataset.k;
    lbStan = { id: el.dataset.id, k, alt: false }; lbSet(); lb.hidden = false; }));
}
lbFilm.onclick = () => lb.hidden = true;
document.getElementById("lbClose").onclick = () => lb.hidden = true;
document.getElementById("lbFlip").onclick = () => { lbStan.alt = !lbStan.alt; lbSet(); };
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { lb.hidden = true; return; }
  if (e.key !== " ") return;
  const t = e.target;      // spacja w polu tekstowym pisze, na przycisku go klika
  if (/^(TEXTAREA|SELECT|BUTTON)$/.test(t.tagName) || t.tagName === "INPUT" && !/^(radio|checkbox)$/.test(t.type)) return;
  if (!lb.hidden && lbStan?.k > 0) { e.preventDefault(); lbStan.alt = !lbStan.alt; lbSet(); }
  else if (lb.hidden && flipCurrent && document.getElementById("flip")) { e.preventDefault(); flipCurrent(); }
});

function renderEnd() {
  const s = ses(), n = SEQ.filter(it => O[it.id]?.ukonczono).length;
  const brak = SEQ.map((it, i) => [it, i]).filter(([it]) => !O[it.id]?.ukonczono);
  $app.innerHTML = `
    <div class="card">
      <h2>${brak.length ? "Koniec listy" : "Dziękujemy!"}</h2>
      <p>Ukończono <b>${n}</b> z ${SEQ.length} pozycji w sesji ${K.aktywna}. Odpowiedzi są zapisane online i są widoczne
         dla zespołu badawczego. Nie trzeba niczego wysyłać. Kod powrotu: <code>${token}</code>.</p>
      ${brak.length ? `<p>Nieukończone pozycje: ${brak.slice(0, 30).map(([it, i]) => `<button class="link" data-i="${i}">${i + 1}</button>`).join(", ")}${brak.length > 30 ? "…" : ""}</p>` : ""}
      <div class="row"><button id="review">← Wróć do ostatniej pozycji</button><button id="toStart">Lista sesji</button></div>
    </div>`;
  document.getElementById("review").onclick = () => { s.idx = SEQ.length - 1; saveKonto(); render(); };
  document.getElementById("toStart").onclick = () => { K.aktywna = null; saveKonto(); render(); };
  $app.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { s.idx = +b.dataset.i; saveKonto(); render(); });
}

// ---------- panel badacza (tylko właściciel) ----------
let allKonta = [], allOdp = [], haslo = "";
async function loadOwner() {
  const j = await api({ akcja: "eksport", haslo });
  allKonta = j.konta.map(k => ({ uid: k.token, ...k.dane }));
  allOdp = j.odp.map(o => ({ uid: o.token, ...o.dane }));
}
async function renderOwner() {
  if (!haslo) {
    $app.innerHTML = `<div class="card"><h2>Panel badacza</h2><form id="hf" class="row">
      <input type="password" id="haslo" placeholder="hasło z Apps Script (HASLO)" style="max-width:280px">
      <button class="primary" type="submit">Wczytaj odpowiedzi</button></form></div>`;
    document.getElementById("hf").onsubmit = e => { e.preventDefault(); haslo = document.getElementById("haslo").value; renderOwner(); };
    return;
  }
  $app.innerHTML = `<div class="card"><p class="muted">Wczytywanie odpowiedzi wszystkich oceniających…</p></div>`;
  try { await loadOwner(); } catch (e) { const m = esc(e?.message || e); haslo = "";
    $app.innerHTML = `<div class="card"><p>Nie udało się wczytać odpowiedzi (${m}).</p><button id="znow">Spróbuj ponownie</button></div>`;
    document.getElementById("znow").onclick = renderOwner; return; }
  const rows = allRows();
  const sesje = allKonta.flatMap(k => Object.entries(k.sesje || {}).map(([sid, s]) => ({ k, sid, s })));
  $app.innerHTML = `
    <div class="card">
      <div class="eyebrow">Wymaga hasła badacza</div>
      <h2>Panel badacza</h2>
      <p class="muted">Odpowiedzi są w Arkuszu Google (zakładki <code>v2_konta</code> i <code>v2_odpowiedzi</code>). Każdy kod powrotu
        widzi tylko swoje odpowiedzi. Kolumna <code>przypadek</code>
        to identyfikator anonimowy (P01–P60, R01–R33). Połącz go z <code>KLUCZ_nie_dla_oceniajacego.csv</code>
        i <code>kontrole_realizmu_KLUCZ.csv</code> w <code>results/ankieta_nih/</code>, np. skryptem <code>tools/ankieta_nih/analiza.py</code>.</p>
      <div class="row">
        <button class="primary" id="dlCsv" ${rows.length ? "" : "disabled"}>Pobierz odpowiedzi (CSV)</button>
        <button id="dlJson" ${allOdp.length ? "" : "disabled"}>Pobierz surowe dane (JSON)</button>
        <button id="odswiez">Odśwież</button>
        <span class="muted" id="dlMsg"></span>
      </div>
      <textarea class="csv" id="csvBox" readonly hidden></textarea>
    </div>
    <div class="card tablewrap">
      ${sesje.length ? `<table><thead><tr><th>Kod</th><th>Sesja</th><th>Identyfikator</th><th>Specjalizacja</th><th>Lata</th><th>Postęp</th><th>Ostatni zapis</th></tr></thead><tbody>
        ${sesje.map(({ k, sid, s }) => `<tr><td><code>${esc(k.uid)}</code></td><td>${sid}</td><td>${esc(s.oceniajacy?.id)}</td>
          <td>${esc(s.oceniajacy?.specjalizacja)}</td><td>${esc(s.oceniajacy?.doswiadczenie_lata)}</td>
          <td><span class="pill ${s.ukonczone === SEQ.length ? "done" : ""}">${s.ukonczone ?? 0}/${SEQ.length}</span></td>
          <td>${s.aktualizacja ? new Date(s.aktualizacja).toLocaleString("pl-PL") : ""}</td></tr>`).join("")}
        </tbody></table>`
      : `<p class="muted">Nikt jeszcze nie zaczął ankiety. Wyślij lekarzom link do strony (bez <code>?panel</code>).</p>`}
    </div>`;
  const stamp = new Date().toISOString().slice(0, 10);
  document.getElementById("dlCsv").onclick = () => offer(`ankieta_nih_v2_odpowiedzi_${stamp}.csv`, toCSV(rows));
  document.getElementById("dlJson").onclick = () => offer(`ankieta_nih_v2_surowe_${stamp}.json`,
    JSON.stringify({ konta: allKonta, odpowiedzi: allOdp }, null, 1));
  document.getElementById("odswiez").onclick = renderOwner;
}
function offer(filename, data) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], { type: filename.endsWith(".csv") ? "text/csv" : "application/json" }));
  a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  document.getElementById("dlMsg").textContent = "Plik pobrany.";
}
function allRows() {
  const poz = Object.fromEntries(SEQ_ALL.map((it, i) => [it.id, i + 1]));
  const konto = Object.fromEntries(allKonta.map(k => [k.uid, k]));
  return allOdp.filter(o => o.ukonczono || o.oryginal || o.realizm != null).flatMap(o => {
    const s = konto[o.uid]?.sesje?.[o.sesja] || {};
    const base = { konto: o.uid, oceniajacy: s.oceniajacy?.id ?? o.oceniajacy, specjalizacja: s.oceniajacy?.specjalizacja ?? "",
      doswiadczenie_lata: s.oceniajacy?.doswiadczenie_lata ?? "", sesja: o.sesja, pozycja: poz[o.pozycja] ?? "",
      przypadek: o.pozycja, typ: o.typ, choroba: o.choroba ?? "", kierunek: o.kierunek ?? "", ukonczono: !!o.ukonczono,
      q0_oryginal: o.oryginal ?? "", q5_najlepsza: o.najlepsza ?? "", czas_s: o.czas_s ?? "", uwagi: o.uwagi ?? "" };
    const pusta = { litera: "", q1_realizacja: "", q2_miejsce: "", q3_zmiany_uboczne: "", q3_inna: "", q4_realizm: "",
      card_co: "", ctr_oryginal: "", ctr_wersja: "", eff_strona: "", eff_menisk: "", edem_inne: "", czas: "" };
    if (o.typ === "realizm") return [{ ...base, ...pusta, q4_realizm: o.realizm ?? "", czas: o.t ?? o.zapisano ?? "" }];
    return LITERY.map(L => { const w = o.wersje?.[L] || {};
      return { ...base, ...pusta, litera: L, q1_realizacja: w.q1 ?? "", q2_miejsce: w.q2 ?? "", q3_zmiany_uboczne: (w.q3 || []).join(";"),
        q3_inna: w.q3_inna ?? "", q4_realizm: w.q4 ?? "", card_co: w.card_co ?? "", ctr_oryginal: w.ctr_oryginal ?? "",
        ctr_wersja: w.ctr_wersja ?? "", eff_strona: w.eff_strona ?? "", eff_menisk: w.eff_menisk ?? "",
        edem_inne: (w.edem_inne || []).join(";"), czas: w.t ?? "" }; });
  });
}
function toCSV(rs) {
  if (!rs.length) return "";
  const cols = Object.keys(rs[0]);
  const q = v => { v = String(v ?? ""); return /[",\n;]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  return [cols.join(","), ...rs.map(r => cols.map(c => q(r[c])).join(","))].join("\n");
}

document.getElementById("ownerBtn").onclick = () => { view = view === "owner" ? "survey" : "owner"; render(); };

function render() {
  flipCurrent = null;
  updateHeader();
  if (view === "owner") return renderOwner();
  const s = ses();
  if (!s) return renderStart();
  if (s.idx >= SEQ.length) return renderEnd();
  const it = SEQ[s.idx];
  it.typ === "realizm" ? renderRealizm(it) : renderCase(it);
}

// ---------- start ----------
(async () => {
  try {
    const d = await (await fetch("dane.json?v=" + WERSJA_STRONY)).json();
    SEQ_ALL = d.sekwencja; SEQ = SEQ_ALL.filter(it => !it.pomin); let nr = 0; SEQ.forEach(it => { if (it.typ === "przypadek") it.nr = ++nr; }); NPRZ = nr;
  } catch { return renderNoAccess("Nie udało się wczytać listy przypadków. Odśwież stronę."); }
  if (typeof API_URL !== "string" || !/^https:\/\/script\.google\.com\//.test(API_URL))
    return renderNoAccess("Ankieta nie jest jeszcze skonfigurowana (brak adresu zapisu w config.js). Proszę skontaktować się z badaczem.");
  try { if ((await api({})).ankieta !== "NIH v2") throw 0; }    // pod adresem nadal stary skrypt (v1)?
  catch { return renderNoAccess("Ankieta jest w trakcie aktualizacji albo nie ma połączenia z bazą odpowiedzi. Proszę spróbować później."); }
  if (typeof setInterval === "function") {
    setInterval(sprawdzWersje, 180000);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") sprawdzWersje(); });
  }
  K = { sesje: {}, aktywna: null };
  if (PANEL) { view = "owner"; return render(); }
  const t = new URLSearchParams(location.search).get("kod")?.toUpperCase() || lsGet("token");
  if (t) {
    try { await wczytajKod(t); }
    catch { return renderNoAccess("Nie udało się połączyć z bazą odpowiedzi. Proszę sprawdzić internet i odświeżyć stronę."); }
    if (K.aktywna && K.sesje[K.aktywna]) return openSession(K.aktywna);
  }
  render();
})();
